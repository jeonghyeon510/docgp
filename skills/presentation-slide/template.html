<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>발표자료</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   1. 디자인 토큰 — 색/폰트를 바꾸려면 여기만 고치면 된다
   ═══════════════════════════════════════════════════════════════ */
:root {
  --w: 1280px;
  --h: 720px;

  --bg:        #0d1020;
  --bg-glow-1: rgba(108, 124, 255, 0.18);
  --bg-glow-2: rgba(179, 136, 255, 0.14);

  --fg:        #e9ecf5;
  --fg-dim:    #949ab5;
  --fg-faint:  #5d6480;

  --a1: #6c7cff;
  --a2: #22d3ee;
  --a3: #f472b6;
  --a4: #4ade80;
  --a5: #fbbf24;

  --card-bg:     rgba(255, 255, 255, 0.035);
  --card-border: rgba(255, 255, 255, 0.09);
  --radius: 14px;

  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕",
          system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* ═══════════════════════════════════════════════════════════════
   2. 무대 — 1280×720 고정 후 화면 크기에 맞춰 축소
   ═══════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; font-family: var(--font); overflow: hidden; }

#stage {
  position: absolute; top: 50%; left: 50%;
  width: var(--w); height: var(--h);
  transform: translate(-50%, -50%) scale(var(--fit, 1));
  transform-origin: center center;
}

.slide {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  padding: 52px 62px;
  background:
    radial-gradient(900px 620px at 12% -10%, var(--bg-glow-1), transparent 60%),
    radial-gradient(760px 560px at 105% 108%, var(--bg-glow-2), transparent 60%),
    var(--bg);
  color: var(--fg); font-size: 17px; line-height: 1.6; overflow: hidden;
}
.slide.active { display: flex; }

#progress {
  position: absolute; top: 0; left: 0; height: 4px;
  background: linear-gradient(90deg, var(--a3), var(--a1));
  transition: width .25s ease; z-index: 20;
}

#nav {
  position: absolute; right: 26px; bottom: 20px;
  display: flex; align-items: center; gap: 10px;
  color: var(--fg-dim); font-size: 13px; z-index: 20;
}
#nav button {
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--card-border); background: rgba(255,255,255,.05);
  color: var(--fg-dim); cursor: pointer; font-size: 12px;
}
#nav button:hover { background: rgba(255,255,255,.12); color: var(--fg); }

.notes { display: none; }

/* ═══════════════════════════════════════════════════════════════
   3. 머리말
   ═══════════════════════════════════════════════════════════════ */
.slide > header { margin-bottom: 24px; flex: none; }
.slide > header .num {
  font-size: 12px; font-weight: 700; letter-spacing: .16em; color: var(--a1); margin-bottom: 6px;
}
.slide > header h2 {
  font-size: 33px; font-weight: 800; letter-spacing: -.02em;
  display: flex; align-items: baseline; gap: 12px;
}
.slide > header h2 .en { font-size: 18px; font-weight: 600; color: var(--fg-faint); letter-spacing: 0; }
.slide > header .sub { margin-top: 6px; font-size: 15px; color: var(--fg-dim); }
.slide > header hr {
  margin-top: 14px; border: 0; height: 1px;
  background: linear-gradient(90deg, var(--card-border), transparent);
}

.body { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }

/* ═══════════════════════════════════════════════════════════════
   4. 부품
   ═══════════════════════════════════════════════════════════════ */
.grid { display: grid; gap: 16px; }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

.card {
  position: relative; overflow: hidden; padding: 20px 22px;
  background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius);
}
.card[class*="accent-"]::before { content:""; position:absolute; top:0; left:0; right:0; height:2px; }
.card.accent-1::before { background: linear-gradient(90deg, var(--a1), transparent); }
.card.accent-2::before { background: linear-gradient(90deg, var(--a2), transparent); }
.card.accent-3::before { background: linear-gradient(90deg, var(--a3), transparent); }
.card.accent-4::before { background: linear-gradient(90deg, var(--a4), transparent); }
.card.accent-5::before { background: linear-gradient(90deg, var(--a5), transparent); }

.card h3 { font-size: 17px; font-weight: 700; margin-bottom: 9px; display:flex; align-items:center; gap:8px; }
.card p  { font-size: 14px; color: var(--fg-dim); }
.card ul { list-style: none; }
.card li { font-size: 13.5px; color: var(--fg-dim); padding-left: 15px; position: relative; margin-top: 6px; }
.card li::before {
  content:""; position:absolute; left:0; top:8px; width:5px; height:5px; border-radius:50%; background: var(--a1);
}
.card li.check::before { content:"✓"; width:auto; height:auto; background:none; color: var(--a4); font-size:12px; top:0; }

.pill {
  display:inline-block; padding: 4px 12px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .04em;
  background: rgba(108,124,255,.16); color:#aab4ff; border:1px solid rgba(108,124,255,.3);
  margin-bottom: 12px;
}
.pill.warn { background: rgba(244,114,182,.14); color:#ffa8d2; border-color: rgba(244,114,182,.3); }
.pill.ok   { background: rgba(74,222,128,.13);  color:#86efac; border-color: rgba(74,222,128,.3); }

.panel {
  padding: 26px 30px; background: var(--card-bg);
  border: 1px solid var(--card-border); border-left: 3px solid var(--a3); border-radius: var(--radius);
}
.panel.ok { border-left-color: var(--a4); }
.panel.info { border-left-color: var(--a1); }
.panel .headline { font-size: 25px; font-weight: 800; line-height: 1.42; margin-bottom: 14px; }
.panel .headline em { font-style: normal; color: var(--a1); }
.panel .lines { list-style: none; }
.panel .lines li { font-size: 14px; color: var(--fg-dim); margin-top: 7px; padding-left: 15px; position: relative; }
.panel .lines li::before {
  content:""; position:absolute; left:0; top:8px; width:5px; height:5px; border-radius:50%; background: var(--a3);
}
.panel .lines b { color: var(--fg); }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: center; flex: 1; min-height: 0; }
.split.wide-right { grid-template-columns: .85fr 1.15fr; }
.split img { width: 100%; height: auto; max-height: 450px; object-fit: contain; border-radius: 10px; }

.figure { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.figure img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }
.caption { margin-top: 10px; text-align: center; font-size: 12.5px; color: var(--fg-faint); }

.placeholder {
  width: 100%; height: 100%; min-height: 240px;
  display: flex; align-items: center; justify-content: center;
  border: 1px dashed var(--card-border); border-radius: 12px; color: var(--fg-faint); font-size: 14px;
}

.steps { list-style: none; }
.steps li { display: flex; gap: 12px; align-items: flex-start; margin-top: 12px; font-size: 14.5px; }
.steps .n {
  flex: none; width: 23px; height: 23px; border-radius: 7px;
  background: rgba(108,124,255,.18); color: #aab4ff; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.steps b { color: var(--fg); }
.steps span { color: var(--fg-dim); }

/* 로드맵 타임라인 */
.timeline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; position: relative; }
.timeline .phase {
  padding: 20px 22px; background: var(--card-bg);
  border: 1px solid var(--card-border); border-radius: var(--radius); border-top: 2px solid var(--a1);
}
.timeline .phase:nth-child(2) { border-top-color: var(--a2); }
.timeline .phase:nth-child(3) { border-top-color: var(--a4); }
.timeline .when { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--a1); }
.timeline .phase:nth-child(2) .when { color: var(--a2); }
.timeline .phase:nth-child(3) .when { color: var(--a4); }
.timeline h3 { font-size: 16px; font-weight: 700; margin: 6px 0 10px; }
.timeline ul { list-style: none; }
.timeline li { font-size: 13px; color: var(--fg-dim); margin-top: 6px; padding-left: 14px; position: relative; }
.timeline li::before { content:"—"; position:absolute; left:0; color: var(--fg-faint); }

/* ═══════════════════════════════════════════════════════════════
   5. 표지 / 마무리
   ═══════════════════════════════════════════════════════════════ */
.slide.cover, .slide.closing { align-items: center; justify-content: center; text-align: center; }
.cover .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .2em; color: var(--a1); margin-bottom: 16px; }
.cover h1 {
  font-size: 64px; font-weight: 800; letter-spacing: -.03em; line-height: 1.16;
  background: linear-gradient(96deg, #ffffff 8%, #b9c2ff 52%, #f0a8d8 96%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.cover .tagline { margin-top: 14px; font-size: 19px; color: var(--fg-dim); }
.cover .meta {
  margin-top: 42px; padding: 15px 30px; border: 1px solid var(--card-border);
  border-radius: 999px; background: rgba(255,255,255,.03); font-size: 15px; color: var(--fg-dim);
}
.cover .meta b { color: var(--fg); }

.closing .quote { font-size: 40px; font-weight: 800; line-height: 1.42; }
.closing .quote em { font-style: normal; color: var(--a1); }
.closing .after { margin-top: 24px; font-size: 16px; color: var(--fg-dim); }
.closing .thanks { margin-top: 38px; font-size: 20px; font-weight: 700; }

/* ═══════════════════════════════════════════════════════════════
   6. 내보내기 / 인쇄 모드
   ═══════════════════════════════════════════════════════════════ */
body.export #stage { top: 0; left: 0; transform: none; }
body.export #nav, body.export #progress { display: none; }

@media print {
  @page { size: 1280px 720px; margin: 0; }
  html, body { overflow: visible; background: #fff; }
  #stage { position: static; transform: none; width: var(--w); height: auto; }
  #nav, #progress { display: none; }
  .slide {
    position: relative; display: flex !important;
    width: var(--w); height: var(--h);
    break-after: page; page-break-after: always;
  }
  .slide:last-child { break-after: auto; page-break-after: auto; }
}
</style>
</head>
<body>

<div id="progress"></div>
<div id="stage">

  <!-- 표지 -->
  <section class="slide cover">
    <div class="eyebrow">PROJECT PRESENTATION</div>
    <h1>프로젝트 이름</h1>
    <div class="tagline">한 줄로 요약한 소개 문장</div>
    <div class="meta">소속　·　<b>팀명</b>　·　<b>발표자 이름</b></div>
    <aside class="notes">
      발표자 노트. 여기 적은 내용은 화면에 안 보이고 PPTX의 '발표자 노트'로 들어간다.
    </aside>
  </section>

  <!-- 내용 슬라이드 — 이 한 장을 복사해서 늘려나간다 -->
  <section class="slide">
    <header>
      <div class="num">01</div>
      <h2>슬라이드 제목 <span class="en">Section Title</span></h2>
      <div class="sub">한 줄 부제</div>
      <hr>
    </header>
    <div class="grid cols-3">
      <div class="card accent-1">
        <h3>카드 제목</h3>
        <p>두 줄을 넘기지 않는다.</p>
      </div>
      <div class="card accent-2">
        <h3>카드 제목</h3>
        <p>한 슬라이드에 카드는 4개까지.</p>
      </div>
      <div class="card accent-3">
        <h3>카드 제목</h3>
        <p>넘칠 것 같으면 슬라이드를 한 장 더 만든다.</p>
      </div>
    </div>
    <aside class="notes">
      쓸 수 있는 부품은 references/slide-parts.md 참고.
    </aside>
  </section>
</div>

<div id="nav">
  <button id="prev" aria-label="이전 슬라이드">◀</button>
  <span id="counter">1 / 1</span>
  <button id="next" aria-label="다음 슬라이드">▶</button>
</div>

<script>
(function () {
  const slides = [...document.querySelectorAll('.slide')];
  const params = new URLSearchParams(location.search);
  const exportMode = params.has('export');
  let cur = 0;

  function show(i) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, n) => s.classList.toggle('active', n === cur));
    document.getElementById('counter').textContent = (cur + 1) + ' / ' + slides.length;
    document.getElementById('progress').style.width = ((cur + 1) / slides.length * 100) + '%';
  }

  function fit() {
    if (exportMode) return;
    document.documentElement.style.setProperty('--fit', Math.min(innerWidth / 1280, innerHeight / 720));
  }

  addEventListener('resize', fit);
  addEventListener('keydown', e => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { show(cur + 1); e.preventDefault(); }
    if (['ArrowLeft', 'PageUp'].includes(e.key))         { show(cur - 1); e.preventDefault(); }
    if (e.key === 'Home') show(0);
    if (e.key === 'End')  show(slides.length - 1);
  });
  document.getElementById('prev').onclick = () => show(cur - 1);
  document.getElementById('next').onclick = () => show(cur + 1);

  if (exportMode) document.body.classList.add('export');
  fit();
  show(parseInt(params.get('slide') || '1', 10) - 1);

  window.__count = slides.length;
  window.__goto  = show;
  window.__notes = i => (slides[i].querySelector('.notes')?.textContent || '').trim();
})();
</script>
</body>
</html>
